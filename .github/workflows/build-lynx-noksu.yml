name: Build blu_spark no-KSU battery (lynx/Pixel 7a)

on:
  workflow_dispatch:
  push:
    branches: [no-ksu-battery]
    paths:
      - '.github/workflows/build-lynx-noksu.yml'
      - 'arch/arm64/configs/blu_spark_defconfig'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: no-ksu-battery
          fetch-depth: 1

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc 2>/dev/null || true
          df -h / | tail -1

      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3 git-core gnupg flex bison build-essential \
            zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 \
            lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev \
            libxml2-utils xsltproc unzip fontconfig lz4 liblz4-tool cpio \
            libssl-dev bc rsync device-tree-compiler lld llvm 2>&1 | tail -2

      - name: Download clang (r522817 = clang 17, sesuai defconfig blu_spark)
        run: |
          mkdir -p $HOME/toolchain
          cd $HOME/toolchain
          URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r522817.tar.gz"
          ok=0
          for i in 1 2 3 4 5; do
            echo "percobaan unduh clang ke-$i"
            curl -fL --retry 3 --retry-delay 5 --connect-timeout 30 --max-time 900 \
                 -C - -o clang.tar.gz "$URL" && \
              gzip -t clang.tar.gz 2>/dev/null && { ok=1; break; }
            echo "gagal/terputus, ulangi..."; sleep 10
          done
          if [ "$ok" != "1" ]; then echo "UNDUH CLANG GAGAL setelah 5 percobaan"; exit 1; fi
          echo "ukuran: $(stat -c%s clang.tar.gz) byte"
          mkdir -p clang && tar xzf clang.tar.gz -C clang
          ls clang/bin/clang && clang/bin/clang --version | head -2

      - name: Build kernel (blu_spark defconfig, KSU off)
        run: |
          cd $GITHUB_WORKSPACE
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH=$HOME/toolchain/clang/bin:$PATH
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export LLVM=1 LLVM_IAS=1
          # full-LLVM: tanpa CROSS_COMPILE gcc (gcc 4.9 terlalu tua, bikin __stack_chk_guard hilang)
          export KBUILD_BUILD_USER=blu_spark-noksu
          export KBUILD_BUILD_HOST=github
          make O=out ARCH=arm64 blu_spark_defconfig
          ./scripts/config --file out/.config -d KSU || true
          set +e
          make -j$(nproc) O=out ARCH=arm64 Image.lz4 dtbs 2>&1 | tee $GITHUB_WORKSPACE/build-error.log | grep -i -m5 "error:" || true
          ls -la out/arch/arm64/boot/Image.lz4 2>/dev/null || (echo "===BUILD-GAGAL, 40 baris error:==="; grep -i -m40 "error" $GITHUB_WORKSPACE/build-error.log | head -40; exit 1)

      - name: Pack AnyKernel3 (lynx, A/B auto-detect)
        run: |
          cd $GITHUB_WORKSPACE
          git clone --depth 1 https://github.com/osm0sis/AnyKernel3.git ak3
          cd ak3
          rm -f .gitattributes README.md devices.txt

          # --- kernel image ---
          cp $GITHUB_WORKSPACE/out/arch/arm64/boot/Image.lz4 ./Image.lz4

          # --- dtb (kalau build menghasilkannya) ---
          # AK3 cuma mengaktifkan mode multi-partisi (boot+init_boot+vendor_kernel_boot)
          # kalau ada FILE bernama persis "dtb" di root zip. blu_spark (kernel Pixel)
          # umumnya TIDAK menghasilkan dtb dari source, jadi langkah ini boleh kosong.
          if [ -f $GITHUB_WORKSPACE/out/arch/arm64/boot/dtb ]; then
            cp $GITHUB_WORKSPACE/out/arch/arm64/boot/dtb ./dtb
            echo "dtb ditemukan -> mode multi-partisi otomatis akan aktif"
          else
            echo "dtb tidak ada -> hanya partisi boot yang di-flash (normal untuk kernel Pixel)"
          fi

          # --- anykernel.sh dari repo (BUKAN template Galaxy Nexus bawaan AK3) ---
          cp $GITHUB_WORKSPACE/anykernel/anykernel.sh ./anykernel.sh

          echo "=== parameter penting anykernel.sh ==="
          grep -E "^(BLOCK|IS_SLOT_DEVICE|device\.name|kernel\.string|do\.devicecheck)" anykernel.sh

          echo "=== pastikan tidak ada sisa Galaxy Nexus di baris AKTIF ==="
          if grep -nE "omap_hsmmc|init\.tuna|fstab\.tuna" anykernel.sh | grep -vE ":\s*#"; then
            echo "GAGAL: masih ada sisa template Galaxy Nexus di baris aktif"; exit 1
          fi
          echo "BERSIH: tidak ada sisa Galaxy Nexus di baris aktif"

          rm -f ramdisk/placeholder modules/system/lib/modules/placeholder 2>/dev/null || true

          zip -r9 $GITHUB_WORKSPACE/blu_spark-noksu-lynx.zip . -x .git/\*
          cd $GITHUB_WORKSPACE
          echo "=== isi ZIP ==="
          unzip -l blu_spark-noksu-lynx.zip | head -22
          ls -la blu_spark-noksu-lynx.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: blu_spark-noksu-lynx
          path: blu_spark-noksu-lynx.zip
          retention-days: 14

      - name: Upload build log (selalu, biar gampang debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-error-log
          path: build-error.log
          retention-days: 7
