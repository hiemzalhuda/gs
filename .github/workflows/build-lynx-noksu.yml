name: Build blu_spark no-KSU battery (lynx/Pixel 7a)

on:
  workflow_dispatch:
  push:
    branches: [no-ksu-battery]
    paths:
      - '.github/workflows/build-lynx-noksu.yml'
      - 'arch/arm64/configs/blu_spark_defconfig'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: no-ksu-battery
          fetch-depth: 1

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc 2>/dev/null || true
          df -h / | tail -1

      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3 git-core gnupg flex bison build-essential \
            zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 \
            lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev \
            libxml2-utils xsltproc unzip fontconfig lz4 liblz4-tool cpio \
            libssl-dev bc rsync device-tree-compiler lld llvm 2>&1 | tail -2

      - name: Download clang (r522817 = clang 17, sesuai defconfig blu_spark) + gcc
        run: |
          mkdir -p $HOME/toolchain
          cd $HOME/toolchain
          curl -sL --max-time 900 -o clang.tar.gz "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r522817.tar.gz"
          mkdir -p clang && tar xzf clang.tar.gz -C clang
          ls clang/bin/clang && clang/bin/clang --version | head -2
          git clone --depth 1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 gcc64 2>&1 | tail -1
          git clone --depth 1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 gcc32 2>&1 | tail -1

      - name: Build kernel (blu_spark defconfig, KSU off)
        run: |
          cd $GITHUB_WORKSPACE
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH=$HOME/toolchain/clang/bin:$HOME/toolchain/gcc64/bin:$HOME/toolchain/gcc32/bin:$PATH
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-
          export LLVM=1 LLVM_IAS=1
          export KBUILD_BUILD_USER=blu_spark-noksu
          export KBUILD_BUILD_HOST=github
          make O=out ARCH=arm64 blu_spark_defconfig
          ./scripts/config --file out/.config -d KSU || true
          set +e
          make -j$(nproc) O=out ARCH=arm64 Image.lz4 dtbs 2>&1 | tee $GITHUB_WORKSPACE/build-error.log | grep -i -m5 "error:" || true
          ls -la out/arch/arm64/boot/Image.lz4 2>/dev/null || (echo "===BUILD-GAGAL, 40 baris error:==="; grep -i -m40 "error" $GITHUB_WORKSPACE/build-error.log | head -40; exit 1)

      - name: Pack AnyKernel3 (lynx)
        run: |
          cd $GITHUB_WORKSPACE
          git clone --depth 1 https://github.com/osm0sis/AnyKernel3.git ak3
          cp out/arch/arm64/boot/Image.lz4 ak3/
          cd ak3
          rm -f .gitattributes README.md
          sed -i 's/^kernel.string=.*/kernel.string=### blu_spark no-KSU battery (lynx) ###/' anykernel.sh
          sed -i 's/^do.devicecheck=.*/do.devicecheck=1/' anykernel.sh
          cat > devices.txt <<'EOF'
          lynx
          Lynx
          Pixel 7a
          EOF
          zip -r9 ../blu_spark-noksu-lynx.zip . -x .git/\*
          cd ..
          ls -la blu_spark-noksu-lynx.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: blu_spark-noksu-lynx
          path: blu_spark-noksu-lynx.zip
          retention-days: 14

      - name: Upload build log (selalu, biar gampang debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-error-log
          path: build-error.log
          retention-days: 7
